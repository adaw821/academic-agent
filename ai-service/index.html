<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学术助手 · Demo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 760px;
         margin: 0 auto; padding: 24px; background: #f5f6f8; color: #222; }
  h1 { font-size: 22px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 14px; font-size: 16px; color: #2a5; }
  input[type=text], input[type=file] { width: 100%; padding: 9px; margin: 6px 0;
          border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  button { background: #2a7; color: #fff; border: 0; padding: 9px 18px; border-radius: 8px;
           cursor: pointer; font-size: 14px; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .out { margin-top: 12px; padding: 12px; background: #f0f2f5; border-radius: 8px;
         font-size: 13px; white-space: pre-wrap; word-break: break-word; min-height: 20px; }
  .src { font-size: 12px; color: #666; border-left: 3px solid #2a7; padding-left: 8px; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #eef6f0; }
  .muted { color: #999; }
</style>
</head>
<body>
  <h1>📚 学术助手 · 接口效果演示</h1>

  <!-- 1. 上传讲义入库 -->
  <div class="card">
    <h2>① 上传讲义（入库）</h2>
    <!-- ✅ 改了这一行：允许 .docx 和 .txt -->
    <input type="file" id="docFile" accept=".docx,.txt">
    <button onclick="ingest()" id="ingestBtn">上传并入库</button>
    <div class="out" id="ingestOut"></div>
  </div>

  <!-- 2. 提问 -->
  <div class="card">
    <h2>② 提问（RAG 问答）</h2>
    <input type="text" id="question" placeholder="例如：这门课怎么考核？" value="这门课怎么考核？">
    <button onclick="ask()" id="askBtn">提问</button>
    <div class="out" id="askOut"></div>
    <div id="sources"></div>
  </div>

  <!-- 3. 课表图片解析 -->
  <div class="card">
    <h2>③ 课表图片解析</h2>
    <input type="file" id="imgFile" accept="image/*">
    <button onclick="parseSchedule()" id="schBtn">上传课表图</button>
    <div class="out" id="schOut"></div>
  </div>

<script>
// 同源部署，直接用相对路径，不用管跨域
async function ingest() {
  const f = document.getElementById('docFile').files[0];
  const out = document.getElementById('ingestOut');
  // ✅ 改了这一行提示
  if (!f) { out.textContent = '请先选一个文件（.docx 或 .txt）'; return; }
  setBusy('ingestBtn', true); out.textContent = '上传中…';
  try {
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/api/rag/ingest', { method: 'POST', body: fd });
    const d = await r.json();
    out.textContent = d.error ? ('❌ ' + d.error)
      : `✅ 《${d.filename}》入库成功，切成 ${d.chunks} 块`;
  } catch (e) { out.textContent = '❌ ' + e; }
  setBusy('ingestBtn', false);
}

async function ask() {
  const q = document.getElementById('question').value.trim();
  const out = document.getElementById('askOut');
  const srcBox = document.getElementById('sources');
  srcBox.innerHTML = '';
  if (!q) { out.textContent = '请输入问题'; return; }
  setBusy('askBtn', true); out.textContent = '🤔 思考中…（非流式，要等模型全部生成，慢点正常）';
  try {
    const r = await fetch('/api/rag/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const d = await r.json();
    out.textContent = '💡 ' + (d.answer || JSON.stringify(d));
    if (d.sources && d.sources.length) {
      srcBox.innerHTML = '<div class="muted" style="margin-top:10px;font-size:12px;">来源片段：</div>'
        + d.sources.map(s => `<div class="src">${escapeHtml(s).slice(0,160)}…</div>`).join('');
    }
  } catch (e) { out.textContent = '❌ ' + e; }
  setBusy('askBtn', false);
}

async function parseSchedule() {
  const f = document.getElementById('imgFile').files[0];
  const out = document.getElementById('schOut');
  if (!f) { out.textContent = '请先选一张课表图片'; return; }
  setBusy('schBtn', true); out.textContent = '解析中…（调大模型看图，慢点正常）';
  try {
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/api/llm/parse_schedule', { method: 'POST', body: fd });
    const d = await r.json();
    if (Array.isArray(d)) { out.innerHTML = renderCourses(d); }
    else { out.textContent = '❌ ' + JSON.stringify(d); }
  } catch (e) { out.textContent = '❌ ' + e; }
  setBusy('schBtn', false);
}

function renderCourses(list) {
  if (!list.length) return '没解析出课程';
  const head = '<tr><th>课程</th><th>周几</th><th>开始</th><th>结束</th><th>地点</th></tr>';
  const rows = list.map(c => `<tr><td>${esc(c.courseName)}</td><td>${c.day_of_week}</td>`
    + `<td>${esc(c.start_time)}</td><td>${esc(c.end_time)}</td><td>${esc(c.location)}</td></tr>`).join('');
  return `<table>${head}${rows}</table>`;
}

function setBusy(id, busy) { document.getElementById(id).disabled = busy; }
function esc(s) { return escapeHtml(s == null ? '' : String(s)); }
function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
</script>
</body>
</html>
